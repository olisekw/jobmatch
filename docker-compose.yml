# The deployment: four containers on one small VPS.
#
#   caddy   → TLS and the only thing bound to a public port
#   web     → gunicorn; N of these is fine, none of them scrapes
#   worker  → the single scraper, and the only container that starts Chromium
#   db      → Postgres 16
#
# Exactly one `worker`. The crawl is shared by every user by design (ROADMAP.md)
# and the Slovak boards are scraped with politeness delays that only mean
# something if one process is doing it. Do not scale this service.
#
#   cp .env.example .env   # then fill in SECRET_KEY, POSTGRES_PASSWORD, DOMAIN
#   docker compose up -d --build

name: jobmatch

x-app: &app
  # Built once, by `web` below. Two services declaring the same build *and* the
  # same tag makes buildkit export it twice in parallel and fail on the second.
  image: jobmatch:latest
  restart: unless-stopped
  env_file: .env
  environment:
    # Composed here rather than in .env so the password has one home.
    DATABASE_URL: postgresql://jobmatch:${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}@db:5432/jobmatch
    DATA_DIR: /app/data
  volumes:
    # CVs. The database is Postgres, so this is the only user data on disk.
    - jobmatch-data:/app/data
  depends_on:
    db:
      condition: service_healthy

services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: jobmatch
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: jobmatch
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      # `web` and `worker` both run init_schema at boot; waiting for healthy is
      # what stops that being a connection error on a cold `up`.
      test: ["CMD-SHELL", "pg_isready -U jobmatch -d jobmatch"]
      interval: 5s
      timeout: 5s
      retries: 12
    # Not published: only the app containers talk to it. Reach it for a backup
    # or a psql with `docker compose exec db …`.

  web:
    <<: *app
    build:
      context: .
    environment:
      DATABASE_URL: postgresql://jobmatch:${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}@db:5432/jobmatch
      DATA_DIR: /app/data
      # Belt and braces: wsgi.py never starts the worker thread, and this makes
      # a config mistake unable to change that.
      SCAN_IN_PROCESS: "false"
      # Both containers write to the same `docker compose logs` stream, so the
      # lines say which one they came from and are parseable when interleaved.
      JOBMATCH_COMPONENT: web
      LOG_FORMAT: json
      # The deployed commit. `deploy.yml` passes the sha it just checked out and
      # then asks /healthz to read it back, which is how the smoke test tells
      # "this deploy is live" from "something answers on this name".
      RELEASE: ${RELEASE:-dev}
    expose:
      - "8000"
    healthcheck:
      # /healthz is public and queries the database, so an unhealthy `web` here
      # means something a page load would actually have hit. urlopen raises on
      # the 503 it answers with when Postgres is gone, which is the point.
      test: ["CMD-SHELL", "python3 -c \"import urllib.request as u; u.urlopen('http://127.0.0.1:8000/healthz').read()\""]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s

  worker:
    <<: *app
    command: ["python3", "-m", "jobmatch.worker"]
    environment:
      DATABASE_URL: postgresql://jobmatch:${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}@db:5432/jobmatch
      DATA_DIR: /app/data
      JOBMATCH_COMPONENT: worker
      LOG_FORMAT: json
      RELEASE: ${RELEASE:-dev}
    healthcheck:
      # It exists so that `up --wait` can *fail* on this container. Measured:
      # compose reports a service with no healthcheck "Healthy" and exits 0
      # even while it is crash-looping — so before this, a worker that died at
      # boot deployed green, and nothing downstream noticed, because the
      # deploy's smoke test only ever touches `web` through `caddy`.
      #
      # What it asserts is what a *second* process in this container can see:
      # the app imports and the database answers. That covers the boot failures
      # (a restarting container can never report healthy) and Postgres going
      # away; it does not cover a loop that is alive but wedged, which is a
      # heartbeat's job and is not what a deploy is asking about.
      test: ["CMD-SHELL", "python3 -c \"from jobmatch import db; db.get_conn().scalar('SELECT 1')\""]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s
    # The same image `web` just built — local only, never on a registry, so say
    # so rather than have compose try to pull `jobmatch:latest` from Docker Hub.
    pull_policy: never
    # A scan runs Chromium, which wants more than Docker's default 64 MB of
    # shared memory; without this the browser dies mid-crawl with a tab crash.
    shm_size: 512mb
    # It polls, so it is idle almost always — but a Playwright crawl is the
    # heaviest thing on the box and must not be able to starve the web tier.
    deploy:
      resources:
        limits:
          memory: 1500m

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"   # HTTP/3
    environment:
      # Caddy reads these out of the Caddyfile; ACME needs both.
      DOMAIN: ${DOMAIN:?set DOMAIN in .env}
      ACME_EMAIL: ${ACME_EMAIL:?set ACME_EMAIL in .env}
      # Extra lines for the Caddyfile's global block, empty on a real
      # deployment. It exists so that running against a name with no public
      # DNS (`local_certs`) or against Let's Encrypt staging for a first
      # issuance (`acme_ca ...`) needs no edit to deploy/Caddyfile — see the
      # comment there.
      CADDY_GLOBAL_OPTIONS: ${CADDY_GLOBAL_OPTIONS:-}
    volumes:
      - ./deploy/Caddyfile:/etc/caddy/Caddyfile:ro
      # The issued certificates. Losing this volume means re-issuing, and
      # Let's Encrypt rate-limits that.
      - caddy-data:/data
      - caddy-config:/config
    healthcheck:
      # Caddy's own admin API, which it listens on at 127.0.0.1:2019 inside the
      # container. Same reason as `worker`: without a healthcheck `up --wait`
      # cannot fail on this service. The deploy workflow would still catch a
      # dead caddy from outside, but `docker compose up -d --build --wait` by
      # hand (DEPLOY.md §6) has no curl after it and would report success.
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1:2019/config/"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s
    depends_on:
      - web

volumes:
  pgdata:
  jobmatch-data:
  caddy-data:
  caddy-config:
