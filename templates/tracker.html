{% extends "base.html" %}
{% block title %}JobMatch — Tracker{% endblock %}
{% block content %}

<h1>Application tracker</h1>
<p class="subtitle">Where you sent your CV, and how it's going.</p>

<div class="stat-tabs" id="tracker-tabs" role="group" aria-label="Filter by where the application got to"></div>

<div class="count-note" id="group-note"></div>

<table class="tracker-table">
  <thead>
    <tr>
      <th style="width:32%">Position</th>
      <th style="width:16%">Company</th>
      <th>Applied</th>
      <th>Status</th>
      <th style="width:24%">Notes</th>
      <th><span class="sr-only">History</span></th>
    </tr>
  </thead>
  <tbody id="app-rows"></tbody>
</table>
<div class="empty" id="empty-note" hidden></div>

{% endblock %}
{% block scripts %}
<script>
// The statuses, the groups and their wording all come from the server, so this
// page, the tabs above it and the job cards never drift apart on what
// "no_response" is called or on which statuses count as still waiting.
let STATUSES = [];
let GROUPS = [];
let apps = [];
let group = "all";

function statusOptions(current) {
  return STATUSES.map(s =>
    `<option value="${esc(s.value)}" ${s.value === current ? "selected" : ""}>${esc(s.label)}</option>`
  ).join("");
}

/* A group with no statuses is "everything" — see display.APPLICATION_GROUPS. */
function inGroup(application, def) {
  return !def.statuses.length || def.statuses.includes(application.status);
}

function currentGroup() {
  return GROUPS.find(g => g.value === group) || GROUPS[0];
}

async function loadApplications() {
  const tbody = document.getElementById("app-rows");
  let data;
  try {
    if (!STATUSES.length) {
      const settings = await api("/api/settings");
      STATUSES = settings.application_statuses;
      GROUPS = settings.application_groups;
    }
    data = await api("/api/applications");
  } catch (err) {
    tbody.innerHTML =
      `<tr><td colspan="6"><div class="load-error" role="alert"><p>${esc(err.message)}</p>
         <button type="button" class="btn small ghost" id="tracker-retry">Try again</button>
       </div></td></tr>`;
    document.getElementById("tracker-retry")
      .addEventListener("click", loadApplications);
    return;
  }
  apps = data.applications;
  render();
}

/* ── The tabs ──────────────────────────────────────────────

   The counts and the filter are the same control: a tally you cannot click is
   a tally you then have to go and find in a table by hand. The tab you are on
   lives in the URL hash, so a bookmark of "my offers" is a bookmark. */

function renderTabs() {
  const counts = {};
  for (const def of GROUPS) counts[def.value] = apps.filter(a => inGroup(a, def)).length;
  /* Only the groups that have something behind them, plus "Everything" and
     whichever tab you are standing on. A tab reading 0 is a word and a zero
     with nothing to click through to, and six of them was most of this page's
     chrome for a tracker holding one application. They come back on their own
     as the search fills up.

     The vocabulary is untouched: `display.APPLICATION_GROUPS` still decides
     which statuses form which group and what each is called — this only
     declines to draw a tab nothing is under. Keeping the selected group drawn
     is what lets a bookmarked `#withdrawn` still explain itself. */
  const shown = GROUPS.filter(def =>
    !def.statuses.length || counts[def.value] > 0 || def.value === group);
  document.getElementById("tracker-tabs").innerHTML = shown.map(def => `
    <button type="button" class="stat-tab${def.value === group ? " active" : ""}"
            data-group="${esc(def.value)}" aria-pressed="${def.value === group}">
      <span class="value">${counts[def.value]}</span>
      <span class="label">${esc(def.label)}</span>
    </button>`).join("");
}

function render() {
  const def = currentGroup();
  const rows = apps.filter(a => inGroup(a, def));
  renderTabs();

  const note = document.getElementById("empty-note");
  note.hidden = rows.length > 0;
  note.innerHTML = apps.length
    ? `Nothing under <b>${esc(def.label.toLowerCase())}</b> right now.`
    : `Nothing here yet — mark a job as Applied on the <a href="/jobs">Jobs</a> page
       and it will show up.`;
  document.getElementById("group-note").textContent =
    rows.length ? `${plural(rows.length, "application")} · ${def.label.toLowerCase()}` : "";

  document.getElementById("app-rows").innerHTML = rows.map(a => `
    <tr data-id="${a.id}">
      <td data-label="Position"><a class="title" href="/jobs/${a.job_id}">${esc(a.title)}</a>
          <a class="out" href="${esc(a.link)}" target="_blank" rel="noopener"
             aria-label="Open this posting on ${esc(a.source_label)}">↗</a></td>
      <td data-label="Company">${esc(a.company || "")}<div class="hint">${esc(a.source_label)}</div></td>
      <td data-label="Applied" title="${esc(a.applied_exact)}">${esc(a.applied_display)}</td>
      <td data-label="Status"><select class="status-select"
             aria-label="Status of your application to ${esc(a.title)}">${statusOptions(a.status)}</select></td>
      <td data-label="Notes"><input type="text" class="notes-input" value="${esc(a.notes)}"
             placeholder="add a note…" aria-label="Your notes on ${esc(a.title)}"></td>
      <td data-label="">${a.events.length ? `<button type="button" class="btn small ghost btn-history"
             aria-expanded="false">History (${a.events.length})</button>` : ""}</td>
    </tr>
    ${a.events.length ? `
    <tr class="events-row" data-for="${a.id}" hidden>
      <td colspan="6">${a.events.map(e =>
        `<div title="${esc(e.at_exact)}">${esc(e.at_display)} — ${esc(e.from_label)} → ${esc(e.to_label)}${e.note ? " · " + esc(e.note) : ""}</div>`
      ).join("")}</td>
    </tr>` : ""}`).join("");
}

document.getElementById("tracker-tabs").addEventListener("click", (e) => {
  const btn = e.target.closest("button[data-group]");
  if (!btn) return;
  group = btn.dataset.group;
  // replaceState rather than assigning location.hash: switching tabs should
  // not stack six entries the Back button then has to walk out of.
  history.replaceState(null, "", group === "all" ? location.pathname : `#${group}`);
  render();
});

document.getElementById("app-rows").addEventListener("change", async (e) => {
  const row = e.target.closest("tr[data-id]");
  if (!row) return;
  const id = row.dataset.id;
  try {
    if (e.target.classList.contains("status-select")) {
      await api(`/api/applications/${id}`, { method: "PATCH", json: { status: e.target.value } });
      toast("Status updated.");
      // A status change can move a row out of the tab you are looking at —
      // which is the point of the tabs, so reload and let it move.
      await loadApplications();
    } else if (e.target.classList.contains("notes-input")) {
      await api(`/api/applications/${id}`, { method: "PATCH", json: { notes: e.target.value } });
      toast("Note saved.");
    }
  } catch (err) {
    toast(err.message);
  }
});

document.getElementById("app-rows").addEventListener("click", (e) => {
  const btn = e.target.closest(".btn-history");
  if (!btn) return;
  const id = btn.closest("tr").dataset.id;
  const eventsRow = document.querySelector(`tr.events-row[data-for="${id}"]`);
  const open = eventsRow.hidden;
  eventsRow.hidden = !open;
  btn.setAttribute("aria-expanded", open ? "true" : "false");
});

// #offer, #waiting, … — validated against the server's groups once they land,
// so a stale bookmark falls back to "everything" instead of showing nothing.
function applyHash() {
  const wanted = location.hash.replace("#", "") || "all";
  if (GROUPS.some(g => g.value === wanted) && group !== wanted) {
    group = wanted;
    render();
  }
}

// Same document, new hash — a pasted link while already on the page never
// reloads anything, so nothing but this would move the tabs.
window.addEventListener("hashchange", applyHash);
loadApplications().then(applyHash);
</script>
{% endblock %}
